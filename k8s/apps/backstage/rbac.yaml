apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-k8s-reader
  namespace: backstage
---
# Long-lived token for Backstage Kubernetes plugin (compatible with Kapsule / K8s ≥ 1.24)
apiVersion: v1
kind: Secret
metadata:
  name: backstage-k8s-reader-token
  namespace: backstage
  annotations:
    kubernetes.io/service-account.name: backstage-k8s-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-k8s-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: backstage-k8s-reader
    namespace: backstage
