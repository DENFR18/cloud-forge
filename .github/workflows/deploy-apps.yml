name: Deploy Apps

on:
  workflow_dispatch:

env:
  SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
  SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
  SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
  SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
  TF_VERSION: 1.7.0

permissions:
  contents: read

concurrency:
  group: deploy-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-yaml:
    name: Validate Kubernetes YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run YAML validation
        run: python scripts/validate_yaml.py

  validate-helm:
    name: Lint and template Helm charts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint and template each chart
        run: |
          for chart in charts/*/; do
            echo "=== Linting $chart ==="
            helm lint "$chart"
            echo "=== Templating $chart ==="
            helm template "$chart" >/dev/null
          done

  prepare:
    name: Resolve registry endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate-yaml, validate-helm]
    outputs:
      registry: ${{ steps.get-registry.outputs.registry }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Get registry endpoint
        id: get-registry
        working-directory: terraform
        run: |
          terraform init
          REGISTRY=$(terraform output -raw registry_endpoint)
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT

      - name: Compute image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  build-push:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: prepare
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: node-api
            context: apps/node-api
          - app: flask-api
            context: apps/flask-api
          - app: react
            context: apps/react
          - app: backstage
            context: backstage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare.outputs.registry }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.registry }}/${{ matrix.app }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.registry }}/${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

      - name: Trivy scan – ${{ matrix.app }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.prepare.outputs.registry }}/${{ matrix.app }}:${{ needs.prepare.outputs.tag }}
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

  deploy:
    name: Sync via ArgoCD
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [prepare, build-push]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Setup kubeconfig
        working-directory: terraform
        run: |
          terraform init
          mkdir -p ~/.kube
          terraform output -raw kubeconfig > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install NGINX Ingress Controller (idempotent)
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          kubectl create namespace ingress-nginx --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --set controller.admissionWebhooks.enabled=false \
            --set controller.admissionWebhooks.patch.enabled=false \
            --timeout 8m

      - name: Ensure ArgoCD is installed
        run: |
          if ! kubectl get ns argocd >/dev/null 2>&1; then
            echo "ArgoCD not found - run the 'Deploy ArgoCD' workflow first."
            exit 1
          fi
          kubectl apply -f argocd/project.yaml
          kubectl apply -f argocd/root-app.yaml

      - name: Get Load Balancer IP
        id: lb
        run: |
          for i in $(seq 1 30); do
            LB_IP=$(kubectl get svc ingress-nginx-controller \
              -n ingress-nginx \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
            if [ -n "$LB_IP" ]; then
              echo "ip=$LB_IP" >> $GITHUB_OUTPUT
              echo "host=${LB_IP}.nip.io" >> $GITHUB_OUTPUT
              echo "Load Balancer IP: $LB_IP"
              break
            fi
            sleep 10
          done

      - name: Seed registry pull secrets
        run: |
          REGISTRY="${{ needs.prepare.outputs.registry }}"
          for NS in stack-react stack-node-api stack-flask-api stack-wordpress stack-ghost stack-gitea backstage; do
            kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
            kubectl create secret docker-registry scr-credentials \
              --docker-server="$REGISTRY" \
              --docker-username=nologin \
              --docker-password="${{ secrets.SCW_SECRET_KEY }}" \
              --namespace="$NS" \
              --dry-run=client -o yaml | kubectl apply -f -
          done

      - name: Seed MySQL secret for WordPress
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_USER_PASSWORD }}
        run: |
          # If MYSQL_ROOT_PASSWORD / MYSQL_USER_PASSWORD GitHub Secrets are unset,
          # generate strong randoms once - they persist in the cluster Secret across runs.
          if kubectl -n stack-wordpress get secret mysql-secret >/dev/null 2>&1; then
            echo "mysql-secret already exists, leaving it untouched"
            exit 0
          fi
          ROOT_PWD="${MYSQL_ROOT_PASSWORD:-$(openssl rand -base64 24)}"
          USER_PWD="${MYSQL_PASSWORD:-$(openssl rand -base64 24)}"
          kubectl create secret generic mysql-secret \
            --namespace stack-wordpress \
            --from-literal=MYSQL_ROOT_PASSWORD="$ROOT_PWD" \
            --from-literal=MYSQL_PASSWORD="$USER_PWD"

      - name: Install ArgoCD CLI
        run: |
          sudo curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo chmod +x /usr/local/bin/argocd
          # argocd --core reads the namespace from kubeconfig context.
          # Pin it to "argocd" so it finds argocd-cm and other resources.
          kubectl config set-context --current --namespace=argocd

      - name: Wait for Applications to be created by root app
        run: |
          for app in namespaces node-api flask-api react wordpress ghost gitea backstage; do
            for i in $(seq 1 30); do
              if kubectl -n argocd get application "$app" >/dev/null 2>&1; then
                echo "Application $app exists"
                break
              fi
              echo "Waiting for Application $app..."
              sleep 5
            done
          done

      - name: Override runtime parameters (registry, tag, ingress host)
        env:
          REGISTRY: ${{ needs.prepare.outputs.registry }}
          IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
          INGRESS_HOST: ${{ steps.lb.outputs.host }}
        run: |
          for app in node-api flask-api react; do
            argocd app set "$app" --core \
              -p image.registry="$REGISTRY" \
              -p image.tag="$IMAGE_TAG"
          done
          for app in wordpress ghost gitea; do
            argocd app set "$app" --core \
              -p ingressHost="$INGRESS_HOST"
          done
          argocd app set backstage --core \
            -p backstage.image.registry="$REGISTRY" \
            -p backstage.image.tag="$IMAGE_TAG" \
            -p ingressHost="$INGRESS_HOST"

      - name: Sync all applications
        run: |
          for app in namespaces node-api flask-api react wordpress ghost gitea backstage; do
            # Cancel any in-progress operation (e.g. auto-sync) before manually syncing
            argocd app terminate-op "$app" --core 2>/dev/null || true
            argocd app sync "$app" --core --timeout 300
          done

      - name: Wait for healthy status
        run: |
          DEGRADED=""
          for app in namespaces node-api flask-api react wordpress ghost gitea backstage; do
            if argocd app wait "$app" --core --health --timeout 300; then
              echo "✅ $app — Healthy"
            else
              echo "⚠️  $app — timed out or degraded (continuing)"
              DEGRADED="$DEGRADED $app"
            fi
          done
          if [ -n "$DEGRADED" ]; then
            echo "::warning::These apps did not reach Healthy within 300s:$DEGRADED"
          fi
          # Fail only if backstage itself is not healthy
          BACKSTAGE_HEALTH=$(argocd app get backstage --core -o json 2>/dev/null \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['status']['health']['status'])" 2>/dev/null || echo "Unknown")
          echo "Backstage health: $BACKSTAGE_HEALTH"
          if [ "$BACKSTAGE_HEALTH" != "Healthy" ] && [ "$BACKSTAGE_HEALTH" != "Progressing" ]; then
            echo "::error::Backstage is $BACKSTAGE_HEALTH — deployment failed"
            exit 1
          fi

      - name: Inject Backstage SA token into credentials secret
        env:
          INGRESS_HOST: ${{ steps.lb.outputs.host }}
        run: |
          # Patch BACKSTAGE_BASE_URL to the live ingress URL so the frontend
          # bundle and backend CORS use the correct host (Terraform default
          # is a placeholder when TF_VAR_backstage_base_url is not provided).
          BASE_URL="http://backstage.${INGRESS_HOST}"
          BASE_URL_B64=$(echo -n "$BASE_URL" | base64 -w0)
          kubectl patch secret backstage-credentials -n backstage \
            -p "{\"data\":{\"BACKSTAGE_BASE_URL\":\"$BASE_URL_B64\"}}"
          echo "backstage-credentials patched with BACKSTAGE_BASE_URL=$BASE_URL"

          # Wait for the SA token secret to be populated by the K8s token controller
          echo "Waiting for backstage-k8s-reader-token to be populated..."
          TOKEN=""
          for i in $(seq 1 24); do
            TOKEN=$(kubectl get secret backstage-k8s-reader-token \
              -n backstage \
              -o jsonpath='{.data.token}' 2>/dev/null | base64 -d 2>/dev/null || echo "")
            if [ -n "$TOKEN" ]; then
              echo "Token retrieved successfully"
              break
            fi
            echo "Not ready yet ($i/24)..."
            sleep 5
          done
          if [ -n "$TOKEN" ]; then
            TOKEN_B64=$(echo -n "$TOKEN" | base64 -w0)
            kubectl patch secret backstage-credentials -n backstage \
              -p "{\"data\":{\"KUBE_SA_TOKEN\":\"$TOKEN_B64\"}}"
            echo "backstage-credentials patched with KUBE_SA_TOKEN"
          else
            echo "WARNING: Could not retrieve SA token — KUBE_SA_TOKEN will remain empty"
          fi

          # Restart Backstage pod to pick up the new secret values
          kubectl rollout restart deployment/backstage -n backstage
          kubectl rollout status deployment/backstage -n backstage --timeout=300s || \
            echo "WARNING: Backstage rollout did not complete in 300s — pod may still be starting"

      - name: Summary
        env:
          LB_IP: ${{ steps.lb.outputs.ip }}
          INGRESS_HOST: ${{ steps.lb.outputs.host }}
          IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          ARGOCD_PASS=$(kubectl -n argocd get secret argocd-initial-admin-secret \
            -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "n/a")

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 🚀 Applications déployées

          | Application | URL |
          |-------------|-----|
          | 🔵 Backstage (IDP) | [http://backstage.${INGRESS_HOST}](http://backstage.${INGRESS_HOST}) |
          | 🟢 WordPress | [http://wordpress.${INGRESS_HOST}](http://wordpress.${INGRESS_HOST}) |
          | 🟢 Ghost | [http://ghost.${INGRESS_HOST}](http://ghost.${INGRESS_HOST}) |
          | 🟢 Gitea | [http://gitea.${INGRESS_HOST}](http://gitea.${INGRESS_HOST}) |
          | 🟡 Node API | [http://${LB_IP}/api](http://${LB_IP}/api) |
          | 🟡 Flask API | [http://${LB_IP}/flask](http://${LB_IP}/flask) |
          | ⚙️ ArgoCD | [http://argocd.${INGRESS_HOST}](http://argocd.${INGRESS_HOST}) |

          ## 🔑 Accès ArgoCD

          | | |
          |-|-|
          | **URL** | http://argocd.${INGRESS_HOST} |
          | **Utilisateur** | \`admin\` |
          | **Mot de passe** | \`${ARGOCD_PASS}\` |

          ## 🌐 Réseau

          | | |
          |-|-|
          | **Load Balancer IP** | \`${LB_IP}\` |
          | **Wildcard DNS** | \`*.${INGRESS_HOST}\` |
          | **Image tag déployée** | \`${IMAGE_TAG}\` |
          EOF
