apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.backstage.replicaCount }}
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      imagePullSecrets:
        - name: {{ .Values.backstage.image.pullSecret }}
      containers:
        - name: backstage
          image: "{{ .Values.backstage.image.registry }}/{{ .Values.backstage.image.repository }}:{{ .Values.backstage.image.tag }}"
          imagePullPolicy: {{ .Values.backstage.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backstage.containerPort }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backstage.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backstage.existingSecret }}
                  key: GITHUB_TOKEN
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backstage.existingSecret }}
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backstage.existingSecret }}
                  key: GITHUB_CLIENT_SECRET
            - name: KUBE_API_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backstage.existingSecret }}
                  key: KUBE_API_URL
            - name: KUBE_SA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backstage.existingSecret }}
                  key: KUBE_SA_TOKEN
            - name: ARGOCD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backstage.existingSecret }}
                  key: ARGOCD_PASSWORD
            - name: BACKSTAGE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backstage.existingSecret }}
                  key: BACKSTAGE_BASE_URL
          volumeMounts:
            - name: backstage-config
              mountPath: /app/app-config.yaml
              subPath: app-config.yaml
          resources:
            {{- toYaml .Values.backstage.resources | nindent 12 }}
      volumes:
        - name: backstage-config
          configMap:
            name: backstage-config
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: backstage
  ports:
    - port: {{ .Values.backstage.servicePort }}
      targetPort: {{ .Values.backstage.containerPort }}
